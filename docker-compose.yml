services:
  db:
    # Pinned to 10 to match the Namecheap shared-hosting deployment target;
    # everything the app uses must work on this floor.
    image: postgres:10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitshipdone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitshipdone}
      POSTGRES_DB: ${POSTGRES_DB:-gitshipdone}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gitshipdone}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
